<!DOCTYPE html>
<html lang="km">

<head>

    <meta
        name="viewport"

    <link

</head>


<body>

    <div class="page-effects">

        <img

        <img
            src="effects/butterfly.gif"

            alt=""

        <img
            src="effects/butterfly.gif"
            class="page-butterfly butterfly-3"
            alt=""
        >

        <img
            src="effects/butterfly.gif"
            class="page-butterfly butterfly-4"
            alt=""
        >


        <!-- ==========================
             8 FALLING PETALS
             ========================== -->

        <img
            src="effects/petal.png"
            class="page-petal petal-1"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-2"

        <img

        <img
            src="effects/petal.png"
            class="page-petal petal-4"

            src="effects/petal.png"
            class="page-petal petal-5"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-6"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-7"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-8"
            alt=""
        >

    </div>



    <!-- ==================================================
         FIXED BACKGROUND
         ================================================== -->

    <div class="fixed-background"></div>



    <!-- ==================================================
         SCROLLING WEDDING CONTENT
         ================================================== -->

<main class="scrolling-content">

    <img
        src="page2-content.png"
        class="page2-content"
        alt="Wedding invitation information"
    >

</main>


    <!-- ==================================================
         FIXED FOREGROUND FLOWERS / LAMPS
         ================================================== -->

    <img
        src="foreground.png"
        class="fixed-foreground"
        alt=""
        aria-hidden="true"
    >

</html>

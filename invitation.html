    <!-- =========================================
         FULL SCREEN PHOTO PREVIEW
         ========================================= -->

    <div id="photoViewer" class="photo-viewer">

        <button
            type="button"
            class="photo-close"
            onclick="closePhoto()"
        >
            ×
        </button>

        <button
            type="button"
            class="photo-prev"
            onclick="previousPhoto()"
        >
            ‹
        </button>

        <img
            id="largePhoto"
            class="large-photo"
            src=""
            alt="Pre-wedding photo"
        >

        <button
            type="button"
            class="photo-next"
            onclick="nextPhoto()"
        >
            ›
        </button>

    </div>

    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>

    const weddingPhotos = [
        "photos/photo1.jpg",
        "photos/photo2.jpg",
        "photos/photo3.jpg",
        "photos/photo4.jpg",
        "photos/photo5.jpg",
        "photos/photo6.jpg",
        "photos/photo7.jpg",
        "photos/photo8.jpg",
        "photos/photo9.jpg",
        "photos/photo10.jpg",
        "photos/photo11.jpg"
    ];

    let currentPhoto = 0;


    function openPhoto(index) {

        currentPhoto = index;

        document.getElementById("largePhoto").src =
            weddingPhotos[currentPhoto];

        document
            .getElementById("photoViewer")
            .classList.add("show");

        document.body.style.overflow = "hidden";
    }


    function closePhoto() {

        document
            .getElementById("photoViewer")
            .classList.remove("show");

        document.body.style.overflow = "";

        document.getElementById("largePhoto").src = "";
    }


    function nextPhoto() {

        currentPhoto++;

        if (currentPhoto >= weddingPhotos.length) {
            currentPhoto = 0;
        }

        document.getElementById("largePhoto").src =
            weddingPhotos[currentPhoto];
    }


    function previousPhoto() {

        currentPhoto--;

        if (currentPhoto < 0) {
            currentPhoto = weddingPhotos.length - 1;
        }

        document.getElementById("largePhoto").src =
            weddingPhotos[currentPhoto];
    }


    document.addEventListener("keydown", function(event) {

        const viewer =
            document.getElementById("photoViewer");

        if (!viewer.classList.contains("show")) {
            return;
        }

        if (event.key === "Escape") {
            closePhoto();
        }

        if (event.key === "ArrowLeft") {
            previousPhoto();
        }

        if (event.key === "ArrowRight") {
            nextPhoto();
        }

    });

    </script>

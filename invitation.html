<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wedding Invitation</title>

    <link
        rel="stylesheet"
        href="invitation.css"
    >
</head>


<body>


    <!-- ==================================================
         FIXED BUTTERFLY + PETAL EFFECTS
         ================================================== -->

    <div class="page-effects">


        <!-- ==========================
             4 BUTTERFLIES
             ========================== -->

        <img
            src="effects/butterfly.gif"
            class="page-butterfly butterfly-1"
            alt=""
        >

        <img
            src="effects/butterfly.gif"
            class="page-butterfly butterfly-2"
            alt=""
        >

        <img
            src="effects/butterfly.gif"
            class="page-butterfly butterfly-3"
            alt=""
        >

        <img
            src="effects/butterfly.gif"
            class="page-butterfly butterfly-4"
            alt=""
        >


        <!-- ==========================
             8 FALLING PETALS
             ========================== -->

        <img
            src="effects/petal.png"
            class="page-petal petal-1"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-2"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-3"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-4"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-5"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-6"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-7"
            alt=""
        >

        <img
            src="effects/petal.png"
            class="page-petal petal-8"
            alt=""
        >

    </div>



    <!-- ==================================================
         FIXED BACKGROUND
         ================================================== -->

    <div class="fixed-background"></div>



    <!-- ==================================================
         SCROLLING WEDDING CONTENT
         ================================================== -->

<main class="scrolling-content">

    <img
        src="page2-content.png"
        class="page2-content"
        alt="Wedding invitation information"
    >
  <!-- PRE-WEDDING PHOTO GALLERY -->

<section class="prewedding-section">

    <!-- PHOTO 1 + 2 -->
    <div class="photo-row">

        <img
            src="photos/photo1.jpg"
            class="gallery-photo"
            onclick="openPhoto(0)"
            alt="Pre-wedding photo 1"
        >

        <img
            src="photos/photo2.jpg"
            class="gallery-photo"
            onclick="openPhoto(1)"
            alt="Pre-wedding photo 2"
        >

    </div>


    <!-- PHOTO 3 -->
    <div class="photo-horizontal">

        <img
            src="photos/photo3.jpg"
            class="gallery-photo"
            onclick="openPhoto(2)"
            alt="Pre-wedding photo 3"
        >

    </div>


    <!-- PHOTO 4 + 5 -->
    <div class="photo-row">

        <img
            src="photos/photo4.jpg"
            class="gallery-photo"
            onclick="openPhoto(3)"
            alt="Pre-wedding photo 4"
        >

        <img
            src="photos/photo5.jpg"
            class="gallery-photo"
            onclick="openPhoto(4)"
            alt="Pre-wedding photo 5"
        >

    </div>


    <!-- PHOTO 6 -->
    <div class="photo-horizontal">

        <img
            src="photos/photo6.jpg"
            class="gallery-photo"
            onclick="openPhoto(5)"
            alt="Pre-wedding photo 6"
        >

    </div>


    <!-- PHOTO 7 + 8 -->
    <div class="photo-row">

        <img
            src="photos/photo7.jpg"
            class="gallery-photo"
            onclick="openPhoto(6)"
            alt="Pre-wedding photo 7"
        >

        <img
            src="photos/photo8.jpg"
            class="gallery-photo"
            onclick="openPhoto(7)"
            alt="Pre-wedding photo 8"
        >

    </div>


    <!-- PHOTO 9 -->
    <div class="photo-horizontal">

        <img
            src="photos/photo9.jpg"
            class="gallery-photo"
            onclick="openPhoto(8)"
            alt="Pre-wedding photo 9"
        >

    </div>


    <!-- PHOTO 10 + 11 -->
    <div class="photo-row">

        <img
            src="photos/photo10.jpg"
            class="gallery-photo"
            onclick="openPhoto(9)"
            alt="Pre-wedding photo 10"
        >

        <img
            src="photos/photo11.jpg"
            class="gallery-photo"
            onclick="openPhoto(10)"
            alt="Pre-wedding photo 11"
        >

    </div>

</section>


<!-- =========================================
     PHOTO PREVIEW
     ========================================= -->

<div id="photoViewer" class="photo-viewer">

    <button
        type="button"
        class="photo-close"
        onclick="closePhoto()"
    >×</button>

    <button
        type="button"
        class="photo-prev"
        onclick="previousPhoto()"
    >‹</button>

    <img
        id="largePhoto"
        class="large-photo"
        src=""
        alt="Pre-wedding photo"
    >

    <button
        type="button"
        class="photo-next"
        onclick="nextPhoto()"
    >›</button>

</div>

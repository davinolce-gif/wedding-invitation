<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cover-page">

        <!-- Canva cover -->
        <img id="guestCover" class="cover-image" alt="Wedding Invitation">

        <!-- Invisible button over Canva button -->
        <a href="invitation.html"
           class="open-invitation"
           aria-label="បើកលិខិតអញ្ជើញ">
        </a>

    </main>

    <script>
        const guests = {
            guest1: "covers/guest1.png",
            guest2: "covers/guest2.png",
            guest3: "covers/guest3.png",
            guest4: "covers/guest4.png"
        };

        const params = new URLSearchParams(window.location.search);
        const guest = params.get("guest");

        const cover = guests[guest] || guests.guest1;

        document.getElementById("guestCover").src = cover;
    </script>

</body>
</html>

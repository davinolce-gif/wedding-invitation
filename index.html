    <!-- =========================================
         GUEST SELECTION
         ========================================= -->

    <script>

        const guests = {

            guest1: "covers/guest1.png",

            guest2: "covers/guest2.png"

        };


        const params =
            new URLSearchParams(
                window.location.search
            );


        const guest =
            params.get("guest");


        const cover =
            guests[guest] || guests.guest1;


        document.getElementById(
            "guestCover"
        ).src = cover;

    </script>

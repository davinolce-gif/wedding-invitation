    <!-- =========================================
         COMBINED SINGLE-PAGE OVERRIDES
         ========================================= -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        .page-one {
            display: block;
            position: relative;
            width: 100%;
            min-height: 100vh;
            opacity: 1;
            transform: scale(1);
            z-index: 100;
        }

        /* =========================================
           CINEMATIC COVER → PAGE 2 TRANSITION
           ========================================= */

        .page-one {
            isolation: isolate;
        }

        .page-one.page-transition {
            animation: coverCinematicExit 1.15s cubic-bezier(0.22, 0.72, 0.25, 1) forwards;
        }

        .page-one.page-transition::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 999998;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 45%,
                    rgba(255, 246, 215, 0.10) 0%,
                    rgba(255, 246, 215, 0.24) 35%,
                    rgba(92, 55, 20, 0.42) 100%),
                rgba(116, 76, 28, 0.18);
            opacity: 0;
            animation: goldenVeil 1.15s ease forwards;
        }

        .page-one.page-transition::before {
            content: "";
            position: fixed;
            left: -15%;
            right: -15%;
            bottom: -18%;
            height: 48%;
            z-index: 999999;
            pointer-events: none;
            border-radius: 50% 50% 0 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(255, 248, 226, 0) 0%,
                    rgba(255, 247, 223, 0.78) 35%,
                    rgba(255, 249, 231, 0.98) 100%
                );
            transform: translateY(115%) scaleX(1.05);
            animation: elegantReveal 1.15s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }

        .page-one.page-hidden {
            display: none !important;
        }

        .page-two {
            display: none;
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        .page-two.page-visible {
            display: block;
            animation: pageTwoReveal 1.25s ease both;
        }

        @keyframes coverCinematicExit {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
            45% {
                opacity: 1;
                transform: scale(1.035) translateY(-0.5%);
                filter: blur(0);
            }
            100% {
                opacity: 0;
                transform: scale(1.10) translateY(-2%);
                filter: blur(7px);
            }
        }

        @keyframes goldenVeil {
            0% {
                opacity: 0;
            }
            38% {
                opacity: 0.10;
            }
            68% {
                opacity: 0.55;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes elegantReveal {
            0% {
                transform: translateY(115%) scaleX(1.05);
                opacity: 1;
            }
            55% {
                transform: translateY(15%) scaleX(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-115%) scaleX(1);
                opacity: 0;
            }
        }

        @keyframes pageTwoReveal {
            0% {
                opacity: 0;
                filter: blur(9px);
            }
            45% {
                opacity: 0.55;
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                filter: blur(0);
            }
        }
            45% {
                opacity: 0.55;
                transform: scale(1.018);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .page-one.page-transition,
            .page-one.page-transition::before,
            .page-one.page-transition::after,
            .page-two.page-visible {
                animation-duration: 0.01ms !important;
            }
        }

        .music-button {
            position: fixed;
            right: 18px;
            top: 18px;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            font-size: 22px;
            line-height: 45px;
            padding: 0;
            cursor: pointer;
            z-index: 999999;
        }

        .music-button:active {
            transform: scale(0.92);
        }


        /* =========================================
           PAGE 1 — FALLING PETALS
           Force petals above the cover image.
           ========================================= */

        .page-one .falling-petal {
            position: absolute !important;
            display: block !important;
            width: 32px !important;
            height: auto !important;
            z-index: 200 !important;
            pointer-events: none !important;
            opacity: 0.95 !important;
            visibility: visible !important;
        }

        .page-one .petal-1 {
            left: 8%;
            top: -8%;
            animation: coverPetalFall1 7s linear infinite !important;
        }

        .page-one .petal-2 {
            left: 22%;
            top: -18%;
            animation: coverPetalFall2 9s linear infinite 1s !important;
        }

        .page-one .petal-3 {
            left: 38%;
            top: -12%;
            animation: coverPetalFall3 8s linear infinite 2s !important;
        }

        .page-one .petal-4 {
            left: 53%;
            top: -20%;
            animation: coverPetalFall4 10s linear infinite 0.5s !important;
        }

        .page-one .petal-5 {
            left: 68%;
            top: -10%;
            animation: coverPetalFall5 8.5s linear infinite 2.5s !important;
        }

        .page-one .petal-6 {
            left: 82%;
            top: -22%;
            animation: coverPetalFall6 9.5s linear infinite 1.5s !important;
        }

        .page-one .petal-7 {
            left: 47%;
            top: -15%;
            animation: coverPetalFall7 7.5s linear infinite 3s !important;
        }

        .page-one .petal-8 {
            left: 92%;
            top: -25%;
            animation: coverPetalFall8 11s linear infinite 0.8s !important;
        }

        @keyframes coverPetalFall1 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
            50%  { transform: translate3d(35px, 50vh, 0) rotate(180deg); }
            100% { transform: translate3d(-20px, 115vh, 0) rotate(360deg); }
        }

        @keyframes coverPetalFall2 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(20deg); }
            50%  { transform: translate3d(-30px, 55vh, 0) rotate(200deg); }
            100% { transform: translate3d(25px, 115vh, 0) rotate(380deg); }
        }

        @keyframes coverPetalFall3 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
            50%  { transform: translate3d(25px, 50vh, 0) rotate(-160deg); }
            100% { transform: translate3d(-35px, 115vh, 0) rotate(-360deg); }
        }

        @keyframes coverPetalFall4 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(10deg); }
            50%  { transform: translate3d(-25px, 55vh, 0) rotate(190deg); }
            100% { transform: translate3d(30px, 115vh, 0) rotate(370deg); }
        }

        @keyframes coverPetalFall5 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
            50%  { transform: translate3d(30px, 50vh, 0) rotate(170deg); }
            100% { transform: translate3d(-25px, 115vh, 0) rotate(350deg); }
        }

        @keyframes coverPetalFall6 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(15deg); }
            50%  { transform: translate3d(-35px, 55vh, 0) rotate(210deg); }
            100% { transform: translate3d(20px, 115vh, 0) rotate(390deg); }
        }

        @keyframes coverPetalFall7 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
            50%  { transform: translate3d(20px, 50vh, 0) rotate(-180deg); }
            100% { transform: translate3d(-30px, 115vh, 0) rotate(-360deg); }
        }

        @keyframes coverPetalFall8 {
            0%   { transform: translate3d(0, -10vh, 0) rotate(20deg); }
            50%  { transform: translate3d(-30px, 55vh, 0) rotate(200deg); }
            100% { transform: translate3d(30px, 115vh, 0) rotate(380deg); }
        }



        /* =========================================
           PAGE 2 — RESTORE FIXED BACKGROUND
           The background stays fixed while all Page 2
           content scrolls over it.
           ========================================= */

        .page-two {
            position: relative !important;
            width: 100% !important;
            min-height: 100vh !important;
        }

        .page-two .fixed-background {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
            pointer-events: none !important;
            background-attachment: fixed !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-size: cover !important;
        }

        .page-two .scrolling-content {
            position: relative !important;
            z-index: 2 !important;
            width: 100% !important;
        }

        .page-two .fixed-foreground {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 3 !important;
            pointer-events: none !important;
        }

        .page-two .page-effects {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 10 !important;
            pointer-events: none !important;
        }

        /* FINAL FIX:
           Never transform the Page 2 container itself.
           This keeps position: fixed layers fixed to the viewport. */
        .page-two,
        .page-two.page-visible {
            transform: none !important;
            will-change: auto !important;
        }

        .page-two .fixed-background,
        .page-two .fixed-foreground,
        .page-two .page-effects {
            position: fixed !important;
            transform: none !important;
            will-change: auto !important;
        }

        /* =========================================
           PHOTO VIEWER — MOBILE BUTTON POSITION
           Keep previous/next arrows centered vertically
           on the screen and aligned to the photo sides.
           ========================================= */

        .photo-viewer .photo-prev,
        .photo-viewer .photo-next {
            position: fixed !important;
            top: 50% !important;
            bottom: auto !important;
            transform: translateY(-50%) !important;
            z-index: 100001 !important;
            width: 52px !important;
            height: 64px !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border: none !important;
            background: rgba(255, 255, 255, 0.18) !important;
            color: #ffffff !important;
            border-radius: 50% !important;
            font-size: 48px !important;
            line-height: 1 !important;
            box-sizing: border-box !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .photo-viewer .photo-prev {
            left: 10px !important;
            right: auto !important;
        }

        .photo-viewer .photo-next {
            right: 10px !important;
            left: auto !important;
        }

        .photo-viewer .photo-close {
            position: fixed !important;
            top: 22px !important;
            right: 18px !important;
            z-index: 100002 !important;
        }

        @media (max-width: 600px) {
            .photo-viewer .photo-prev,
            .photo-viewer .photo-next {
                width: 48px !important;
                height: 58px !important;
                font-size: 44px !important;
            }

            .photo-viewer .photo-prev {
                left: 8px !important;
            }

            .photo-viewer .photo-next {
                right: 8px !important;
            }
        }

        /* Keep the fullscreen photo viewer above everything. */
        .photo-viewer {
            z-index: 99999 !important;
        }

        @media (max-width: 600px) {
            .music-button {
                right: 12px;
                top: 12px;
                width: 42px;
                height: 42px;
                line-height: 42px;
                font-size: 20px;
            }
        }
    </style>

    function closePhoto() {

            .classList.remove("show");

        document.getElementById("largePhoto").src = "";

    function nextPhoto() {

        if (currentPhoto >= weddingPhotos.length) {

        document.getElementById("largePhoto").src =

            weddingPhotos[currentPhoto];

            document.getElementById("photoViewer");

<script>

const weddingDate = new Date("2026-12-16T00:00:00+07:00");



function updateCountdown() {



    const now = new Date();



    if (now >= weddingDate) {

        document.getElementById("countdown-months").textContent = "00";

        document.getElementById("countdown-days").textContent = "00";

        return;

    }



    let months =

        (weddingDate.getFullYear() - now.getFullYear()) * 12 +

        (weddingDate.getMonth() - now.getMonth());



    let monthDate = new Date(now);



    monthDate.setMonth(monthDate.getMonth() + months);



    if (monthDate > weddingDate) {

        months--;



        monthDate = new Date(now);

        monthDate.setMonth(monthDate.getMonth() + months);

    }



    const remaining = weddingDate - monthDate.getTime();



    const days = Math.floor(

        remaining / (1000 * 60 * 60 * 24)

    );



    document.getElementById("countdown-months").textContent =

        String(months).padStart(2, "0");



    document.getElementById("countdown-days").textContent =

        String(days).padStart(2, "0");

}



updateCountdown();



setInterval(updateCountdown, 60000);

</script>

    <script>
// Guest cover: ?guest=John loads covers/John.png
        const params = new URLSearchParams(window.location.search);
        const guest = params.get("guest");

        if (guest) {
            const guestCover = document.getElementById("guestCover");
            guestCover.src = "covers/" + encodeURIComponent(guest) + ".png";
        }

        // Page 1 -> Page 2, without loading another HTML file.
        function startWeddingMusic() {
            const music = document.getElementById("weddingMusic");

            if (!music || !music.paused) {
                return;
            }

            music.play().catch(function () {
                // The play request is made from the invitation click.
                // If Telegram still blocks it, the browser controls playback.
            });
        }

        function openInvitation(event) {
            event.preventDefault();

            const pageOne = document.getElementById("pageOne");
            const pageTwo = document.getElementById("pageTwo");

            // The invitation button itself is also a user gesture,
            // so use it to start music if it has not started yet.
            startWeddingMusic();

            pageOne.classList.add("page-transition");

            setTimeout(function () {
                pageOne.classList.add("page-hidden");
                pageTwo.classList.add("page-visible");
                window.scrollTo({ top: 0, behavior: "instant" });
            }, 1150);
        }

    </script>
